# IP-based access on port 80 (for Flutter app) - default server
server {
    listen 80 default_server;
    server_name 172.167.43.172 _;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Domain redirect to HTTPS
server {
    listen 80;
    server_name dayparty.work.gd;
    return 301 https://$host$request_uri;
}

# HTTPS for domain
server {
    listen 443 ssl http2;
    server_name dayparty.work.gd;

    ssl_certificate /etc/letsencrypt/live/dayparty.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dayparty.work.gd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
