<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Party Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1>Day Party Admin Panel</h1>
            <p>Sign in with Google to access the admin panel</p>
            <button id="login-btn" class="btn btn-primary">Sign in with Google</button>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="screen" style="display: none;">
        <header class="admin-header">
            <h1>Day Party Admin Panel</h1>
            <div class="header-actions">
                <span id="user-info" class="user-info"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <main class="admin-main">
            <!-- Filters -->
            <section class="filters-section">
                <h2>Filters</h2>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="filter-thread">Thread ID:</label>
                        <input type="text" id="filter-thread" placeholder="Enter thread ID">
                    </div>
                    <div class="filter-group">
                        <label for="filter-author">Author ID:</label>
                        <input type="text" id="filter-author" placeholder="Enter author ID">
                    </div>
                    <div class="filter-group">
                        <label for="filter-deleted">Show Deleted:</label>
                        <select id="filter-deleted">
                            <option value="">All</option>
                            <option value="true">Deleted Only</option>
                            <option value="false">Active Only</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-moderation">Moderation State:</label>
                        <select id="filter-moderation">
                            <option value="">All</option>
                            <option value="visible">Visible</option>
                            <option value="limited">Limited</option>
                            <option value="hidden">Hidden</option>
                            <option value="removed">Removed</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-limit">Limit:</label>
                        <input type="number" id="filter-limit" value="50" min="1" max="200">
                    </div>
                    <div class="filter-actions">
                        <button id="apply-filters" class="btn btn-primary">Apply Filters</button>
                        <button id="clear-filters" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </section>

            <!-- Nodes List -->
            <section class="nodes-section">
                <div class="section-header">
                    <h2>Nodes (Messages/Replies)</h2>
                    <div id="pagination-info" class="pagination-info"></div>
                </div>
                <div id="loading" class="loading" style="display: none;">Loading...</div>
                <div id="nodes-list" class="nodes-list"></div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Node</h2>
                <button class="modal-close" id="close-edit-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <input type="hidden" id="edit-node-id">
                    
                    <div class="form-group">
                        <label for="edit-title">Title:</label>
                        <input type="text" id="edit-title" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="edit-text-content">Text Content:</label>
                        <textarea id="edit-text-content" class="form-control" rows="5"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="edit-moderation">Moderation State:</label>
                        <select id="edit-moderation" class="form-control">
                            <option value="visible">Visible</option>
                            <option value="limited">Limited</option>
                            <option value="hidden">Hidden</option>
                            <option value="removed">Removed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="edit-is-deleted">
                            Mark as Deleted
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" id="cancel-edit">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
